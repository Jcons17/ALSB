<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="description" content="Tablero de comunicación accesible con letras grandes y sugerencias de palabras." />
    <title>Letter Loop — Tablero de comunicación</title>
    <link rel="stylesheet" href="communication.css" />
    <script src="words-es.js" defer></script>
    <script src="communication.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="quick-phrases-launch" id="open-phrases-button" type="button" aria-label="Mostrar frases rápidas"><span aria-hidden="true">💬</span> Frases</button>
      </header>

      <main id="inicio">
        <section class="board-layout" aria-label="Tablero interactivo">
          <div class="main-column">
            <section class="card spelling-card" aria-label="Mensaje">
              <div class="word-track" id="word-track" aria-live="polite" aria-label="Tu mensaje"><span class="empty-track">Tu mensaje aparecerá aquí.</span></div>
              <div class="suggestion-row" id="suggestion-row" aria-label="Sugerencias de palabras" hidden></div>
              <div class="message-controls" aria-label="Controles para escribir">
                <button class="message-control" id="space-button" type="button"><span aria-hidden="true">␣</span> Espacio</button>
                <button class="message-control" id="undo-button" type="button" aria-label="Borrar última letra"><span aria-hidden="true">⌫</span> Borrar última</button>
                <button class="message-control reset-button clear-message-button" id="reset-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11a8.5 8.5 0 1 1 2.1 5.7M3.5 11V5.5M3.5 11H9"/></svg><span>Borrar todo</span></button>
                <button class="message-control punctuation-control" data-character="," type="button" aria-label="Añadir coma">,</button>
                <button class="message-control punctuation-control" data-character="." type="button" aria-label="Añadir punto">.</button>
                <button class="message-control punctuation-control" data-character="?" type="button" aria-label="Añadir signo de pregunta">?</button>
                <button class="message-control punctuation-control" data-character="!" type="button" aria-label="Añadir signo de exclamación">!</button>
              </div>
            </section>

            <section class="card alphabet-card" aria-label="Letras">
              <div class="alphabet-header">
                <div class="set-indicator"><span id="set-label">1 / 5</span></div>
              </div>
              <div class="letter-grid" id="letter-grid" role="group" aria-label="Letras del grupo actual"></div>
              <div class="board-footer">
                <button class="previous-set-button" id="previous-set-button" type="button" aria-label="Grupo anterior">←</button>
                <button class="next-set-button" id="next-set-button" type="button" aria-label="Siguiente grupo">→</button>
              </div>
            </section>
          </div>
        </section>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <dialog class="quick-phrases-dialog" id="quick-phrases-dialog" aria-label="Frases rápidas">
          <div class="dialog-heading">
            <button class="dialog-close" id="close-phrases-button" type="button" aria-label="Cerrar frases rápidas">×</button>
          </div>
          <div class="quick-phrase-grid">
            <button type="button" data-phrase="Sí">Sí</button>
            <button type="button" data-phrase="No">No</button>
            <button type="button" data-phrase="Ayuda, por favor">Ayuda</button>
            <button type="button" data-phrase="Quiero agua">Quiero agua</button>
            <button type="button" data-phrase="Quiero ir al baño">Ir al baño</button>
            <button type="button" data-phrase="Tengo dolor">Tengo dolor</button>
            <button type="button" data-phrase="Tengo hambre">Tengo hambre</button>
            <button type="button" data-phrase="Estoy bien">Estoy bien</button>
            <button type="button" data-phrase="Gracias">Gracias</button>
          </div>
        </dialog>
      </main>
    </div>
  </body>
</html>
